name: Overlap
options:
  bundleIdPrefix: com.crggr.overlap
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: NO
    OVERLAP_CLOUD_SYNC_ENABLED: "YES"

targets:
  OverlapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Overlap-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.crggr.overlap.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Overlap.app/Contents/MacOS/Overlap"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # iPhone + iPad share one target: same model layer, input model differs by idiom.
  Overlap-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/ServiceEndpoint.xcconfig
      Release: Config/ServiceEndpoint.xcconfig
    info:
      path: Config/Info-iOS.plist
      properties:
        ComboFallbackEndpoint: "$(COMBO_FALLBACK_ENDPOINT)"
        CloudSyncEnabled: "$(OVERLAP_CLOUD_SYNC_ENABLED)"
        # This target uses an explicit plist; INFOPLIST_KEY_* generation settings
        # are ignored when GENERATE_INFOPLIST_FILE is NO.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: Overlap/Shared
      - path: Overlap/iOS
      - path: Overlap/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Overlap
        PRODUCT_BUNDLE_IDENTIFIER: com.crggr.overlap
        CODE_SIGN_ENTITLEMENTS: Config/Overlap-Cloud.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  Overlap-macOS:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/ServiceEndpoint.xcconfig
      Release: Config/ServiceEndpoint.xcconfig
    info:
      path: Config/Info-macOS.plist
      properties:
        ComboFallbackEndpoint: "$(COMBO_FALLBACK_ENDPOINT)"
        CloudSyncEnabled: "$(OVERLAP_CLOUD_SYNC_ENABLED)"
    sources:
      - path: Overlap/Shared
      - path: Overlap/macOS
      - path: Overlap/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Overlap
        PRODUCT_BUNDLE_IDENTIFIER: com.crggr.overlap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Overlap-macOS-Cloud.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES

  Overlap-tvOS:
    type: application
    platform: tvOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/ServiceEndpoint.xcconfig
      Release: Config/ServiceEndpoint.xcconfig
    info:
      path: Config/Info-tvOS.plist
      properties:
        ComboFallbackEndpoint: "$(COMBO_FALLBACK_ENDPOINT)"
        CloudSyncEnabled: "$(OVERLAP_CLOUD_SYNC_ENABLED)"
    sources:
      - path: Overlap/Shared
      - path: Overlap/tvOS
      - path: Overlap/Resources/tvOS.xcassets
    settings:
      base:
        PRODUCT_NAME: Overlap
        PRODUCT_BUNDLE_IDENTIFIER: com.crggr.overlap
        CODE_SIGN_ENTITLEMENTS: Config/Overlap-Cloud.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon"
        TVOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
